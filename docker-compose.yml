version: '3.8'

services:

  # ======================
  # DATABASES
  # ======================

  restaurant-db:
    image: mysql:8
    container_name: restaurant-db
    environment:
      MYSQL_ROOT_PASSWORD: rahasia123
      MYSQL_DATABASE: restaurant_db
    ports:
      - "3307:3306"
    volumes:
      - restaurant-data:/var/lib/mysql
      - ./database/restaurant.sql:/docker-entrypoint-initdb.d/restaurant.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prahasia123"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: mysql:8
    container_name: order-db
    environment:
      MYSQL_ROOT_PASSWORD: rahasia123
      MYSQL_DATABASE: order_db
    ports:
      - "3319:3306"
    volumes:
      - order-data:/var/lib/mysql
      - ./database/order.sql:/docker-entrypoint-initdb.d/order.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prahasia123"]
      interval: 5s
      timeout: 5s
      retries: 10

  delivery-db:
    image: mysql:8
    container_name: delivery-db
    environment:
      MYSQL_ROOT_PASSWORD: rahasia123
      MYSQL_DATABASE: delivery_db
    ports:
      - "3314:3306"
    volumes:
      - delivery-data:/var/lib/mysql
      - ./database/delivery.sql:/docker-entrypoint-initdb.d/delivery.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prahasia123"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: mysql:8
    container_name: payment-db
    environment:
      MYSQL_ROOT_PASSWORD: rahasia123
      MYSQL_DATABASE: payment_db
    ports:
      - "3320:3306"
    volumes:
      - payment-data:/var/lib/mysql
      - ./database/payment.sql:/docker-entrypoint-initdb.d/payment.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prahasia123"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ======================
  # SERVICES
  # ======================

  restaurant-service:
    build: ./restaurant-service
    ports:
      - "3315:3001"
    depends_on:
      restaurant-db:
        condition: service_healthy
    env_file:
      - ./restaurant-service/.env
    environment:
      - DB_HOST=restaurant-db

  order-service:
    build: ./order-service
    ports:
      - "3316:3002"
    depends_on:
      order-db:
        condition: service_healthy
    env_file:
      - ./order-service/.env
    environment:
      - DB_HOST=order-db

  payment-service:
    build: ./payment-service
    ports:
      - "3317:3003"
    depends_on:
      payment-db:
        condition: service_healthy
    env_file:
      - ./payment-service/.env
    environment:
      - DB_HOST=payment-db

  delivery-service:
    build: ./delivery-service
    ports:
      - "3318:3004"
    depends_on:
      delivery-db:
        condition: service_healthy
    env_file:
      - ./delivery-service/.env
    environment:
      - DB_HOST=delivery-db

volumes:
  restaurant-data:
  order-data:
  delivery-data:
  payment-data: